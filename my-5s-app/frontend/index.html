<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบประเมิน Green 7S Plus มหาวิทยาลัยเทคโนโลยีราชมงคลศรีวิชัย</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1b5e20;
            --primary-light: #2e7d32;
            --secondary: #0d47a1;
            --bg-page: #f8fafc;
            --surface-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius-lg: 16px;
            --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #e8f5e9 0%, #f8fafc 60%);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--surface-card);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 440px;
            padding: 36px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            text-align: center;
        }

        .institution-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(27, 94, 32, 0.25);
        }

        .login-header h2 {
            margin: 0;
            font-size: 1.35em;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.3px;
        }

        .login-header p {
            margin: 6px 0 24px 0;
            font-size: 0.88em;
            color: var(--text-muted);
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95em;
            color: var(--text-main);
            background: #ffffff;
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(27, 94, 32, 0.12);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary) 0%, #2e7d32 100%);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(27, 94, 32, 0.2);
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .auth-footer {
            margin-top: 24px;
            font-size: 0.82em;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="institution-logo">🏛️</div>
    <div class="login-header">
        <h2>ระบบประเมิน 7ส. ออนไลน์ (Green 7S Plus)</h2>
        <p>มหาวิทยาลัยเทคโนโลยีราชมงคลศรีวิชัย</p>
    </div>

    <form onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="username">บัญชีผู้ใช้ หรือ อีเมลองค์กร:</label>
            <input type="text" id="username" class="form-control" placeholder="เช่น somchai.j หรือ somchai@rmutsv.ac.th" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">รหัสผ่าน:</label>
            <input type="password" id="password" class="form-control" placeholder="รหัสผ่านเริ่มต้น (123456)" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login" id="submitBtn">🔐 เข้าสู่ระบบปฏิบัติการ</button>
    </form>

    <div class="auth-footer">
        ระบบสงวนสิทธิ์สำหรับบุคลากรและคณะกรรมการภายใน<br>หากลืมรหัสผ่าน กรุณาประสานงานผู้ดูแลระบบส่วนกลาง
    </div>
</div>

<script>
    async function handleLogin(e) {
        e.preventDefault();
        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value.trim();
        const submitBtn = document.getElementById('submitBtn');

        if (!usernameInput || !passwordInput) {
            alert('กรุณากรอกชื่อผู้ใช้และรหัสผ่านให้ครบถ้วน');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'กำลังตรวจสอบสิทธิ์...';

        try {
            const res = await fetch('https://my-7s-app.onrender.com/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: usernameInput,
                    password: passwordInput
                })
            });

            const data = await res.json();

            if (res.ok) {
                // บันทึก Token และ User Information
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('userData', JSON.stringify(data.user));

                // จำแนกสิทธิ์แล้วส่งไปหน้า Dashboard ตามบทบาท
                const role = data.user.role;
                if (role === 'Admin') {
                    window.location.href = 'admin_dashboard.html';
                } else if (role === 'Area Owner') {
                    window.location.href = 'owner_dashboard.html';
                } else if (role && role.includes('Assessor')) {
                    window.location.href = 'assessment_form.html';
                } else {
                    window.location.href = 'assessment_form.html';
                }
            } else {
                alert('❌ ' + (data.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'));
            }
        } catch (err) {
            console.error('Login error:', err);
            alert('❌ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = '🔐 เข้าสู่ระบบปฏิบัติการ';
        }
    }
</script>
</body>
</html>
